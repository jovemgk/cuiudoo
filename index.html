<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Servos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h2>Controle de Servo Motores</h2>
    <button id="btnConnect">Conectar Arduino</button>

    <div class="control-group">
      <label for="servo1">Servo 1: <span id="val1">90</span>°</label>
      <input type="range" id="servo1" min="0" max="180" value="90">
    </div>

    <div class="control-group">
      <label for="servo2">Servo 2: <span id="val2">90</span>°</label>
      <input type="range" id="servo2" min="0" max="180" value="90">
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
